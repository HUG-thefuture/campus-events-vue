name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"   # pnpm 11 需要较新 Node（20 会报 ERR_UNKNOWN_BUILTIN_MODULE）
      - run: corepack enable
      - run: pnpm install
      - run: pnpm -r build
